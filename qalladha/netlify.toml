# قلّدها — موقع صغير مستقلّ تماماً (لا علاقة له بموقع خُطى)
# ملفات ثابتة فقط: الغرف تعيش في Supabase ويناديها المتصفّح مباشرة،
# فلا دوالّ خادم هنا ولا خطوة بناء.
[build]
  publish = "."

# المايكروفون مسموح لنفس النطاق — اللعبة كلها قائمة عليه.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "microphone=(self), camera=(), geolocation=()"

# لا نخزّن الصفحة في الكاش كي تصل التعديلات فوراً
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
