# إعدادات نشر خُطى على Netlify
# هذا الملف يخبر Netlify أين يجد ملفات الموقع وأين يجد الدوال الوسيطة (Functions)

[build]
  publish = "."
  functions = "netlify/functions"

# الدالة المجدولة لإرسال التذكير اليومي — تعمل كل يوم الساعة 6 مساءً بتوقيت
# السعودية (UTC+3)؛ الجدولة دائماً بتوقيت UTC، لذا 15:00 UTC = 18:00 السعودية
[functions."send-reminders"]
  schedule = "0 15 * * *"

# رؤوس أمان إضافية بسيطة (لا تؤثر على عمل الموقع، تحسّن فقط سلوك المتصفح الأمني الافتراضي)
# ⚠️ إضافات فحص أمني (2026-08-11): HSTS يفرض HTTPS على المتصفح لكل الزيارات
# القادمة (Netlify يخدم HTTPS دائماً أصلاً، هذا يمنع حتى محاولة اتصال HTTP
# أولى قابلة لهجوم وسيط)، وPermissions-Policy يعطّل صراحة صلاحيات المتصفح
# التي لا يستخدمها الموقع إطلاقاً (كاميرا/مايكروفون/موقع جغرافي) — الموقع
# لا يستدعي أياً منها في الكود، فتعطيلها لا يكسر شيئاً ويقلّل سطح الهجوم
# لو حصل XSS مستقبلاً في تبعية خارجية.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    # ============================================================
    # Content-Security-Policy — طبقة حماية إضافية ضد XSS وتسريب البيانات
    # ------------------------------------------------------------
    # ⚠️ صدق تام حول حدودها هنا: 'unsafe-inline' في script-src إجباري حالياً
    # لأن الواجهة تعتمد 213 معالج onclick داخل HTML و421 نمط style مضمّن.
    # وجودها يعني أن هذه السياسة لا تمنع تنفيذ سكربت مُحقَن داخل الصفحة —
    # إزالتها تتطلب نقل كل المعالجات إلى addEventListener، وهو تعديل واسع
    # يستحق عمله وحده بحذر (مخطَّط، غير منفَّذ بعد).
    #
    # ما تمنعه هذه السياسة فعلياً رغم ذلك، وهو مكسب حقيقي لا شكلي:
    # - connect-src: يمنع تسريب أي بيانات مسروقة إلى خادم مهاجم — لو نجح XSS
    #   فلن يستطيع إرسال ما جمعه إلا لنطاقاتنا المسرودة أدناه.
    # - script-src بنطاقات محددة: يمنع تحميل سكربت من أي مصدر غريب.
    # - object-src 'none' وbase-uri 'self': يمنعان حقن <base> والإضافات.
    # - form-action 'self': يمنع اختطاف النماذج لإرسالها لموقع مهاجم.
    #
    # ⚠️ كل نطاق أدناه مستخرج من فحص فعلي للكود — حذف أي منها يعطّل ميزة:
    #   jsdelivr = مكتبة Supabase | cdnjs = Font Awesome وpdf.js
    #   fonts.googleapis/gstatic = الخطوط | supabase.co = القاعدة (https+wss)
    #   raw.githubusercontent = بيانات الجامعات والدورات | formspree = الملاحظات
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob:; connect-src 'self' https://squhkiwjwwyrgufkaujf.supabase.co wss://squhkiwjwwyrgufkaujf.supabase.co https://raw.githubusercontent.com https://formspree.io; worker-src 'self' blob: https://cdnjs.cloudflare.com; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"

# ============================================================
# تخزين مؤقّت للملفات — عُدِّل بعد ٣ حوادث متتالية سببها بالضبط أن متصفحاً
# استمر يعرض نسخة قديمة مخبَّأة من index.html/app.js/styles.css رغم رفع
# تحديث جديد فعلياً. الإعداد السابق (max-age=3600) كان يسمح للمتصفح بتجاهل
# الخادم كلياً لمدة ساعة كاملة قبل حتى السؤال عن وجود تحديث. الآن:
# - index.html وapp.js وstyles.css: "no-cache" — لا يعني عدم التخزين إطلاقاً،
#   بل أن المتصفح يُخزّن نسخة لكن يجب عليه دائماً التحقق من الخادم أولاً
#   (طلب تحقق خفيف جداً عبر ETag، لا تنزيل كامل إن لم يتغيّر الملف) قبل
#   استخدامها — يضمن وصول أي تحديث فوراً دون التضحية بسرعة معقولة.
# - أيقونات PWA: لا تتغيّر عملياً أبداً بعد اعتمادها، وحتى لو تغيّرت فأثر
#   بقاء نسخة قديمة منها لفترة تخزين مؤقت (أسبوعين) شكلي بحت لا وظيفي —
#   آمنة لتخزين أطول.
# - ملفات البيانات (content.json وuniversities.json وspecialties.json
#   وexam-questions.json): بلا تخزين مؤقت إطلاقاً — هذه بالذات ما ذكرته
#   أنك تُحدّثها مباشرة برفع نسخة جديدة على GitHub (بنك أسئلة جديد، تحديث
#   بيانات جامعة...)، ويجب أن يصل أي تحديث لها فوراً لكل الزوار.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  # app.js قُسّم إلى js/*.js — النمط يغطي كل الأجزاء، وأي جزء يُضاف مستقبلاً
  # يرث القاعدة تلقائياً بلا تعديل هنا (وهذا مقصود: نسيان تحديث هذا الملف
  # بعد إضافة جزء جديد كان سيعيد بالضبط حوادث النسخ القديمة المخبّأة الثلاث).
  for = "/js/*"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/icon-*.png"
  [headers.values]
    Cache-Control = "public, max-age=1209600, immutable"
[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "no-cache"
